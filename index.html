<!doctype html>
<!--biome-ignore lint/a11y/useHtmlLang: Can't specify a language, since i18n handles internationalization -->
<html>
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob:; img-src 'self' data: blob: local-media: aim-plugin: aim-plugin-user: http://127.0.0.1:* http://localhost:*; media-src 'self' data: blob: local-media: aim-plugin: aim-plugin-user: http://127.0.0.1:* http://localhost:*; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; font-src 'self' data:;"
    >
    <title>AI Image Manager</title>
    <!-- 在 CSS 加载前同步设置主题 class，避免暗色/浅色闪烁 -->
    <script>
    "use strict";
    (() => {
      try {
        let theme = localStorage.getItem("theme") || "system";
        if (theme === "system") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.classList.add(theme);
        const accentColors = [
          "blue",
          "green",
          "yellow",
          "pink",
          "orange",
          "purple",
        ];
        const themeAccentColor = document.documentElement.classList.contains(
          "light"
        )
          ? "black"
          : "default";
        accentColors.push(themeAccentColor);
        const storedAccentColor = localStorage.getItem("ui.accentColor");
        const accentColor = accentColors.includes(storedAccentColor || "")
          ? storedAccentColor
          : "blue";
        document.documentElement.dataset.accentColor = accentColor;
        if (storedAccentColor !== accentColor) {
          localStorage.setItem("ui.accentColor", accentColor);
        }
        document.documentElement.dataset.reducedMotion =
          localStorage.getItem("ui.reduceMotion") === "true" ? "true" : "false";
        const activePlugin = localStorage.getItem("plugins.active");
        if (activePlugin) {
          document.documentElement.dataset.activePlugin = activePlugin;
          if (activePlugin === "com.uyoung.theme.nebula-glass") {
            document.documentElement.dataset.nebulaGlass = "active";
          }
        }
      } catch {
        document.documentElement.dataset.accentColor = "blue";
        document.documentElement.dataset.reducedMotion = "false";
        // localStorage 不可用时静默忽略
      }
    })();
    </script>
    <link rel="stylesheet" href="/src/styles/global.css">
  </head>
  <body>
    <div id="app" />
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
