name: Maintain COS release storage

on:
  schedule:
    - cron: '23 20 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: '盘点、预览、清理过期临时包，或配置一天后回收未完成分块'
        type: choice
        default: preview-expired
        options:
          - inventory
          - preview-expired
          - prune-expired
          - configure-multipart-lifecycle

permissions:
  contents: read
  actions: read
concurrency:
  group: release-production
  cancel-in-progress: false
env:
  COS_RELEASE_PREFIX: ${{ vars.COS_RELEASE_PREFIX || 'ai-image-manager' }}
  COS_BUCKET: ${{ vars.COS_BUCKET || 'ai-image-manager-1392398678' }}
  COS_REGION: ${{ vars.COS_REGION || 'ap-hongkong' }}
jobs:
  maintain:
    if: github.event_name != 'schedule' || vars.COS_STORAGE_MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release-candidate
    env:
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      OPERATION: ${{ inputs.action || 'prune-expired' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/release/package-lock.json
      - name: Install release transport only
        run: npm ci --ignore-scripts --prefix scripts/release
      - name: Preview eligible temporary objects
        if: env.OPERATION == 'preview-expired' || env.OPERATION == 'prune-expired'
        run: node scripts/release/supervise.mjs scripts/release-cos-maintenance.mjs preview-expired --output cos-cleanup-plan.json
      - name: Save cleanup preview before any deletion
        if: env.OPERATION == 'preview-expired' || env.OPERATION == 'prune-expired'
        uses: actions/upload-artifact@v4
        with:
          name: cos-cleanup-plan-${{ github.run_id }}
          path: cos-cleanup-plan.json
          retention-days: 90
          if-no-files-found: error
      - name: Apply requested operation
        shell: bash
        run: |
          case "$OPERATION" in
            inventory)
              node scripts/release/supervise.mjs scripts/release-cos-maintenance.mjs inventory --output cos-maintenance-report.json
              ;;
            preview-expired)
              cp cos-cleanup-plan.json cos-maintenance-report.json
              ;;
            prune-expired)
              node scripts/release/supervise.mjs scripts/release-cos-maintenance.mjs prune-expired --plan cos-cleanup-plan.json --confirmation 'PRUNE EXPIRED RELEASE TEMPORARIES' --output cos-maintenance-report.json
              ;;
            configure-multipart-lifecycle)
              node scripts/release/supervise.mjs scripts/release-cos-maintenance.mjs configure-multipart-lifecycle --confirmation 'ABORT RELEASE MULTIPART AFTER 1 DAY' --output cos-maintenance-report.json
              ;;
            *) exit 1 ;;
          esac
      - name: Save maintenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cos-maintenance-${{ github.run_id }}
          path: cos-maintenance-report.json
          retention-days: 90
          if-no-files-found: ignore
