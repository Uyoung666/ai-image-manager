# Build once; downstream retries reuse the exact immutable artifact.
name: Release
'on':
  workflow_dispatch:
    inputs:
      version:
        description: 已有版本 Tag 的版本号（不带 v）
        required: true
        type: string
      source_run_id:
        description: 恢复已保存产物时填写源运行 ID；正常发布留空
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_run_id:
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
  attestations: read
concurrency:
  group: release-production
  cancel-in-progress: false
defaults:
  run:
    shell: pwsh
env:
  NODE_VERSION: '22'
  RELEASE_VERSION: ${{ inputs.version }}
  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
  RELEASE_CONTEXT: ${{ github.workspace }}/release-context.json
  RELEASE_BUNDLE: ${{ github.workspace }}/release-bundle
  RELEASE_EVIDENCE: ${{ github.workspace }}/release-evidence
jobs:
  preflight:
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      version: ${{ steps.preflight.outputs.version }}
      tag: ${{ steps.preflight.outputs.tag }}
      commit: ${{ steps.preflight.outputs.commit }}
      sourceRunId: ${{ steps.preflight.outputs.sourceRunId }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
    - name: Validate release and resolve baseline
      id: preflight
      env:
        GH_TOKEN: ${{ github.token }}
      run: node scripts/release-pipeline.mjs preflight
    - name: Save release context
      uses: actions/upload-artifact@v4
      with:
        name: release-context
        path: release-context.json
        retention-days: 90
        if-no-files-found: error
  build:
    needs:
    - preflight
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
    - name: Preserve repository line endings
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v6
      with:
        path: tooling
        fetch-depth: 0
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
    - uses: actions/download-artifact@v4
      with:
        name: release-context
        path: .
    - name: Recover exact existing bundle
      if: inputs.source_run_id != ''
      env:
        GH_TOKEN: ${{ github.token }}
      run: node tooling/scripts/release-pipeline.mjs recover
    - name: Checkout application tag
      if: inputs.source_run_id == ''
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.preflight.outputs.commit }}
        path: app
    - name: Install application dependencies
      if: inputs.source_run_id == ''
      working-directory: app
      run: npm ci
    - name: Cache release models
      if: inputs.source_run_id == ''
      uses: actions/cache@v4
      with:
        path: app/models
        key: ${{ runner.os }}-models-all-${{ hashFiles('app/src/services/model-downloader.ts') }}
    - name: Prepare release models
      if: inputs.source_run_id == ''
      working-directory: app
      run: node --loader ts-node/esm scripts/prepare-models.mjs
    - name: Configure pinned release baseline
      if: inputs.source_run_id == ''
      working-directory: app
      run: node ../tooling/scripts/release-pipeline.mjs configure-build
    - name: Install and verify WiX Toolset
      shell: pwsh
      run: |
        node scripts/setup-wix-toolset.mjs
        $wixPath = Join-Path $env:LOCALAPPDATA "AIImageManagerBuildTools\wix-3.14.0"
        if (-not (Test-Path -LiteralPath (Join-Path $wixPath "candle.exe"))) {
          throw "WiX candle.exe was not installed"
        }
        if (-not (Test-Path -LiteralPath (Join-Path $wixPath "light.exe"))) {
          throw "WiX light.exe was not installed"
        }
        $wixPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & (Join-Path $wixPath "candle.exe") -? | Select-Object -First 2
        & (Join-Path $wixPath "light.exe") -? | Select-Object -First 2
      if: inputs.source_run_id == ''
      working-directory: app
    - name: Gate - static check
      run: |-
        npm run check
        if ($LASTEXITCODE -ne 0) { throw "Release build gate failed" }
      if: inputs.source_run_id == ''
      working-directory: app
    - name: Gate - unit tests
      run: |-
        npm test
        if ($LASTEXITCODE -ne 0) { throw "Release build gate failed" }
      if: inputs.source_run_id == ''
      working-directory: app
    - name: Build Forge artifacts and save dry-run metadata
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |-
        foreach ($generatedPath in @("out", "release-feed", "release-download", "release-evidence")) {
          if (Test-Path -LiteralPath $generatedPath) {
            throw "Release runner is not clean; remove stale generated path before rerunning: $generatedPath"
          }
        }
        npx electron-forge publish --dry-run

        if ($LASTEXITCODE -ne 0) { throw "Release build gate failed" }
      if: inputs.source_run_id == ''
      working-directory: app
    - name: Gate - packaged update feed injection
      shell: pwsh
      run: |
        $asarFiles = @(Get-ChildItem -LiteralPath "out" -Recurse -File -Filter "app.asar" | Where-Object {
          $_.FullName -notmatch "\\publish-dry-run\\"
        })
        if ($asarFiles.Count -ne 1) {
          throw "Expected exactly one packaged app.asar, found $($asarFiles.Count)"
        }
        $env:RELEASE_ASAR_PATH = $asarFiles[0].FullName
        node --input-type=module -e 'import { extractFile, listPackage } from "@electron/asar"; import process from "node:process"; const asarPath = process.env.RELEASE_ASAR_PATH; const expectedFeed = process.env.AIM_UPDATE_BASE_URL; const retiredFeed = "ai-image-manager-1392398678.cos.ap-hongkong.myqcloud.com"; const runtimeOverrides = ["AIM_UPDATE_TEST_BASE_URL", "process.env.AIM_UPDATE_BASE_URL"]; const entries = listPackage(asarPath).filter((entry) => /^[\\/]?\.vite[\\/]build[\\/].*\.js$/i.test(entry)); if (entries.length === 0) { throw new Error("Packaged app.asar has no .vite/build JavaScript bundles"); } const source = entries.map((entry) => extractFile(asarPath, entry.replace(/^[\\/]/, "")).toString("utf8")).join("\n"); if (!source.includes(expectedFeed)) { throw new Error(`Packaged Vite bundles do not contain the exact GitHub update base: ${expectedFeed}`); } if (source.includes(retiredFeed)) { throw new Error("Packaged Vite bundles still contain the retired COS update feed"); } for (const override of runtimeOverrides) { if (source.includes(override)) { throw new Error(`Packaged Vite bundles still expose runtime update override: ${override}`); } } console.log(`Verified ${asarPath}: GitHub update base injected and COS/runtime feeds absent across ${entries.length} bundles.`);'
        if ($LASTEXITCODE -ne 0) {
          throw "Packaged update feed injection gate failed"
        }
      if: inputs.source_run_id == ''
      working-directory: app
    - name: Verify Squirrel and WiX release payload
      id: payload
      shell: pwsh
      run: |
        $squirrelDirectory = Join-Path $PWD "out\make\squirrel.windows\x64"
        $wixDirectory = Join-Path $PWD "out\make\wix\x64"
        $zipDirectory = Join-Path $PWD "out\make\zip\win32\x64"
        $manifest = Join-Path $squirrelDirectory "RELEASES"
        $releaseVersion = "${{ needs.preflight.outputs.version }}"
        $currentFullPattern = "-$([regex]::Escape($releaseVersion))-full\.nupkg$"
        $currentDeltaPattern = "-$([regex]::Escape($releaseVersion))-delta\.nupkg$"
        $fullPackage = @(Get-ChildItem -LiteralPath $squirrelDirectory -File -Filter "*.nupkg" | Where-Object { $_.Name -match $currentFullPattern })
        $deltaPackage = @(Get-ChildItem -LiteralPath $squirrelDirectory -File -Filter "*.nupkg" | Where-Object { $_.Name -match $currentDeltaPattern })
        $setup = @(Get-ChildItem -LiteralPath $squirrelDirectory -File -Filter "*Setup.exe")
        $msi = @(Get-ChildItem -LiteralPath $wixDirectory -File -Filter "*.msi")
        $wixSource = @(Get-ChildItem -LiteralPath $wixDirectory -File -Filter "*.wxs")
        $zip = @(Get-ChildItem -LiteralPath $zipDirectory -File -Filter "*.zip" | Where-Object {
          $_.Name -match "-$([regex]::Escape($releaseVersion))\.zip$"
        })

        if (-not (Test-Path -LiteralPath $manifest)) {
          throw "Missing Squirrel RELEASES manifest"
        }
        if ($fullPackage.Count -ne 1) {
          throw "Expected exactly one Squirrel full NUPKG, found $($fullPackage.Count)"
        }
        if ($setup.Count -ne 1) {
          throw "Expected exactly one Squirrel Setup.exe, found $($setup.Count)"
        }
        if ($msi.Count -ne 1) {
          throw "Expected exactly one WiX MSI, found $($msi.Count)"
        }
        if ($wixSource.Count -ne 1) {
          throw "Expected generated WiX source, found $($wixSource.Count)"
        }
        if ($zip.Count -ne 1) {
          throw "Expected exactly one current-version ZIP, found $($zip.Count)"
        }
        if ($env:AIM_HAS_STABLE_BASELINE -eq "1" -and $deltaPackage.Count -ne 1) {
          throw "Stable RELEASES baseline was configured but no Squirrel delta NUPKG was produced"
        }
        if ($env:AIM_HAS_STABLE_BASELINE -ne "1" -and $deltaPackage.Count -gt 0) {
          throw "A delta package was produced without an explicitly configured stable baseline"
        }
        if ($deltaPackage.Count -eq 1 -and $deltaPackage[0].Length -ge $fullPackage[0].Length) {
          throw "Squirrel delta must be smaller than the current full NUPKG"
        }

        $wixSourcePath = $wixSource[0].FullName
        if (-not (Select-String -LiteralPath $wixSourcePath -SimpleMatch 'InstallScope="perMachine"')) {
          throw "WiX MSI must run per-machine"
        }
        if (Select-String -LiteralPath $wixSourcePath -Pattern 'DISABLEROLLBACK|<DisableRollback') {
          throw "WiX MSI must preserve transactional rollback"
        }
        if (-not (Select-String -LiteralPath $wixSourcePath -SimpleMatch 'Icon="ApplicationIcon" IconIndex="0"')) {
          throw "WiX shortcuts are missing their cached application icon"
        }

        "squirrel=$squirrelDirectory" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "wix=$wixDirectory" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "setup=$($setup[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "msi=$($msi[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "zip=$($zip[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        Write-Host "Verified full Squirrel package, optional delta baseline, Setup.exe, MSI rollback, and shortcut icon."
      if: inputs.source_run_id == ''
      working-directory: app
    - name: Seal release bundle
      if: inputs.source_run_id == ''
      working-directory: app
      run: node ../tooling/scripts/release-pipeline.mjs prepare
    - name: Save immutable release bundle
      id: bundle
      uses: actions/upload-artifact@v4
      with:
        name: release-bundle-${{ needs.preflight.outputs.version }}
        path: release-bundle/
        retention-days: 7
        compression-level: 0
        if-no-files-found: error
    - name: Record source artifact identity
      run: '@{ artifactId = "${{ steps.bundle.outputs.artifact-id }}"; digest = "${{ steps.bundle.outputs.artifact-digest }}"; runId = "${{ github.run_id }}"; commit = "${{ needs.preflight.outputs.commit
        }}"; toolingCommit = "${{ github.sha }}" } | ConvertTo-Json | Set-Content release-artifact.json'
    - uses: actions/upload-artifact@v4
      with:
        name: release-artifact-${{ needs.preflight.outputs.version }}
        path: release-artifact.json
        retention-days: 90
        if-no-files-found: error
  attest:
    needs:
    - preflight
    - build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: release-bundle-${{ needs.preflight.outputs.version }}
        path: release-bundle
    - name: Attest release bundle
      uses: actions/attest@v4
      with:
        subject-path: release-bundle/**
  smoke:
    needs:
    - preflight
    - build
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
    - uses: actions/download-artifact@v4
      with:
        name: release-context
        path: .
    - uses: actions/download-artifact@v4
      with:
        name: release-bundle-${{ needs.preflight.outputs.version }}
        path: release-bundle
    - name: Test installers against local feed
      run: node scripts/release-pipeline.mjs smoke
    - name: Save installer smoke evidence
      uses: actions/upload-artifact@v4
      with:
        name: release-smoke-${{ needs.preflight.outputs.version }}
        path: release-evidence/smoke-status.json
        retention-days: 90
        if-no-files-found: error
    - name: Save installer diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: release-evidence/installer-logs/
        retention-days: 7
        if-no-files-found: ignore
  github:
    needs:
    - preflight
    - smoke
    - attest
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
    - uses: actions/download-artifact@v4
      with:
        name: release-context
        path: .
    - uses: actions/download-artifact@v4
      with:
        name: release-bundle-${{ needs.preflight.outputs.version }}
        path: release-bundle
    - uses: actions/download-artifact@v4
      with:
        name: release-smoke-${{ needs.preflight.outputs.version }}
        path: release-evidence
    - name: Verify immutable bundle and attestation
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        node scripts/release-pipeline.mjs verify
        if ($LASTEXITCODE -ne 0) { throw "Bundle verification failed" }
        gh attestation verify release-bundle/bundle.json --repo "$env:GITHUB_REPOSITORY" --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/publish.yaml" --source-digest "$env:GITHUB_SHA"
        if ($LASTEXITCODE -ne 0) { throw "Bundle attestation verification failed" }
    - name: Stage GitHub release
      run: node scripts/release-pipeline.mjs github-stage
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      actions: read
      attestations: read
  finalize:
    needs:
    - preflight
    - github
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
    - uses: actions/download-artifact@v4
      with:
        name: release-context
        path: .
    - uses: actions/download-artifact@v4
      with:
        name: release-bundle-${{ needs.preflight.outputs.version }}
        path: release-bundle
    - uses: actions/download-artifact@v4
      with:
        name: release-smoke-${{ needs.preflight.outputs.version }}
        path: release-evidence
    - name: Verify immutable bundle and attestation
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        node scripts/release-pipeline.mjs verify
        if ($LASTEXITCODE -ne 0) { throw "Bundle verification failed" }
        gh attestation verify release-bundle/bundle.json --repo "$env:GITHUB_REPOSITORY" --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/publish.yaml" --source-digest "$env:GITHUB_SHA"
        if ($LASTEXITCODE -ne 0) { throw "Bundle attestation verification failed" }
    - name: Publish verified GitHub release
      run: node scripts/release-pipeline.mjs github-finalize
    - name: Report release state
      if: always()
      run: '"Release: v$env:RELEASE_VERSION. Source run: $env:GITHUB_RUN_ID. GitHub assets and update manifest were verified before publication." |
        Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append'
