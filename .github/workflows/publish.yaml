name: Build release candidate

on:
  push:
    tags:
      - "v*"
  # A candidate that failed before any immutable COS write can be rerun without
  # creating another tag. Once testing/candidate/download objects exist, a
  # retry is safe only when the rebuilt bytes are identical.
  workflow_dispatch:
    inputs:
      version:
        description: "已有候选 tag 的版本号（例如 2.1.0，不带 v）"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  # Push tags expose `vX.Y.Z`; manual retries accept `X.Y.Z`. Normalize both
  # forms into one group so a tag run and its manual retry cannot overlap.
  group: release-candidate-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  # v2.1.0 is the first public MSI. It has no trustworthy previous MSI and
  # may use the one-time fresh-install gate; every later version must upgrade
  # from an explicitly hashed public MSI baseline.
  AIM_FIRST_OFFICIAL_MSI_VERSION: "2.1.0"
  # These are non-secret channel locations. Keep credentials in secrets; the
  # repository's release CLI receives them from the job environment.
  COS_PUBLIC_BASE_URL: ${{ vars.COS_PUBLIC_BASE_URL || 'https://ai-image-manager-1392398678.cos.ap-hongkong.myqcloud.com' }}
  COS_APP_FEED: ${{ vars.COS_APP_FEED || 'https://ai-image-manager-1392398678.cos.ap-hongkong.myqcloud.com/ai-image-manager/updates/win32/x64/stable' }}
  # Directory URL containing the current build-base RELEASES file. Forge
  # passes this to electron-winstaller only when the baseline exists.
  COS_BUILD_BASE_URL: ${{ vars.COS_BUILD_BASE_URL || 'https://ai-image-manager-1392398678.cos.ap-hongkong.myqcloud.com/ai-image-manager/updates/win32/x64/build-base' }}
  COS_RELEASE_PREFIX: ${{ vars.COS_RELEASE_PREFIX || 'ai-image-manager' }}
  COS_BUCKET: ${{ vars.COS_BUCKET || 'ai-image-manager-1392398678' }}
  COS_REGION: ${{ vars.COS_REGION || 'ap-hongkong' }}

jobs:
  candidate:
    name: Build, test, and stage candidate
    runs-on: windows-2022
    # Configure this environment with required reviewers. This is the first
    # human gate: approval authorizes publishing the tested run to candidate
    # and creating the GitHub Draft.
    environment: release-candidate
    env:
      # Define these as release-candidate environment secrets belonging to a
      # CAM identity that cannot write stable/ or build-base/.
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
    timeout-minutes: 90
    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Restore current release tooling for manual retry
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          # Keep application sources pinned to the immutable tag while allowing
          # reviewed release-automation fixes and their focused tests to recover
          # a failed candidate without mixing tool and test revisions.
          git checkout $env:WORKFLOW_SHA -- scripts/release scripts/release-cos.mjs scripts/windows-installer-smoke.mjs src/tests/unit/release-cos.test.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to restore release tooling from $env:WORKFLOW_SHA"
          }

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache release models
        uses: actions/cache@v4
        with:
          path: models
          key: ${{ runner.os }}-models-all-${{ hashFiles('src/services/model-downloader.ts') }}

      - name: Prepare release models
        run: node --loader ts-node/esm scripts/prepare-models.mjs

      - name: Install and verify WiX Toolset
        shell: pwsh
        run: |
          node scripts/setup-wix-toolset.mjs
          $wixPath = Join-Path $env:LOCALAPPDATA "AIImageManagerBuildTools\wix-3.14.0"
          if (-not (Test-Path -LiteralPath (Join-Path $wixPath "candle.exe"))) {
            throw "WiX candle.exe was not installed"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $wixPath "light.exe"))) {
            throw "WiX light.exe was not installed"
          }
          $wixPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $wixPath "candle.exe") -? | Select-Object -First 2
          & (Join-Path $wixPath "light.exe") -? | Select-Object -First 2

      - name: Gate - static check
        run: npm run check

      - name: Gate - unit tests
        run: npm test

      - name: Resolve release tag and channels
        id: release
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          git fetch --tags --force
          if ($env:GITHUB_EVENT_NAME -eq "push") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $dispatchVersion = $env:DISPATCH_VERSION.Trim() -replace '^v', ''
            $tag = "v$dispatchVersion"
          }
          if ($tag -notmatch '^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Release ref must be a SemVer tag beginning with v: $tag"
          }
          $version = $tag.Substring(1)
          $tagCommit = (git rev-list -n 1 $tag).Trim()
          if (-not $tagCommit) {
            throw "Release tag was not found locally: $tag"
          }
          $sourceDateEpoch = (git show -s --format=%ct $tagCommit).Trim()
          if ($sourceDateEpoch -notmatch '^\d+$') {
            throw "Unable to resolve Unix commit timestamp for $tag at $tagCommit"
          }
          $checkoutCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $checkoutCommit) {
            throw "Checkout commit $checkoutCommit does not match release tag $tag at $tagCommit"
          }
          if (-not $env:COS_APP_FEED) {
            throw "COS_APP_FEED/AIM_COS_APP_FEED repository variable is required"
          }
          foreach ($channelURL in @{
              COS_PUBLIC_BASE_URL = $env:COS_PUBLIC_BASE_URL
              COS_APP_FEED = $env:COS_APP_FEED
              COS_BUILD_BASE_URL = $env:COS_BUILD_BASE_URL
            }.GetEnumerator()) {
            try {
              $parsedURL = [Uri]$channelURL.Value
            } catch {
              throw "$($channelURL.Key) must be a valid HTTPS URL: $($channelURL.Value)"
            }
            if ($parsedURL.Scheme -ne "https") {
              throw "$($channelURL.Key) must use HTTPS: $($channelURL.Value)"
            }
          }
          $prefixPart = if ($env:COS_RELEASE_PREFIX) {
            "$($env:COS_RELEASE_PREFIX.Trim('/'))/"
          } else {
            ""
          }
          $testingFeed = $env:COS_PUBLIC_BASE_URL.TrimEnd('/') + "/" + $prefixPart + "updates/win32/x64/testing/runs/" + $env:GITHUB_RUN_ID
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "commit=$tagCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "SOURCE_DATE_EPOCH=$sourceDateEpoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "testing-feed=$testingFeed" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          # The stable feed is optional for the first release. When present,
          # Forge uses it to derive a delta while still writing only testing.
          "AIM_HAS_STABLE_BASELINE=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $baselineURL = $env:COS_BUILD_BASE_URL.TrimEnd('/') + "/RELEASES"
          try {
            $baselineResponse = Invoke-WebRequest -Uri $baselineURL -Method Head -UseBasicParsing
            if ($baselineResponse.StatusCode -eq 404) {
              Write-Host "No build-base RELEASES baseline found; full package only is expected."
            } elseif ($baselineResponse.StatusCode -ge 200 -and $baselineResponse.StatusCode -lt 400) {
              "AIM_SQUIRREL_REMOTE_RELEASES=$($env:COS_BUILD_BASE_URL.TrimEnd('/'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "AIM_HAS_STABLE_BASELINE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Write-Host "Existing build-base RELEASES baseline found; delta generation is enabled."
            } else {
              throw "Unexpected build-base RELEASES response status: $($baselineResponse.StatusCode)"
            }
          } catch {
            $statusCode = $null
            if ($_.Exception.Response) {
              $statusCode = [int]$_.Exception.Response.StatusCode.value__
            }
            if ($statusCode -eq 404) {
              Write-Host "No build-base RELEASES baseline found; full package only is expected."
            } else {
              throw "Unable to probe build-base RELEASES at $baselineURL (HTTP $($statusCode ?? 'unknown')): $($_.Exception.Message)"
            }
          }

      - name: Gate - release guard (package, lock, tag, and version ordering)
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $guardArgs = @(
            "scripts/release-cos.mjs",
            "guard",
            "--package", "package.json",
            "--lock", "package-lock.json",
            "--tag", $env:RELEASE_TAG
          )
          $latestUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $latest = $null
          try {
            $latest = Invoke-RestMethod -Uri $latestUrl -Headers $headers -Method Get
          } catch {
            $statusCode = $null
            if ($_.Exception.Response) {
              $statusCode = [int]$_.Exception.Response.StatusCode.value__
            }
            if ($statusCode -eq 404) {
              # A genuine 404 means this repository has no formal stable
              # release yet; only this first-release case may use allow-initial.
              $guardArgs += "--allow-initial"
              Write-Host "GitHub releases/latest returned 404; allowing initial stable bootstrap."
            } else {
              throw "Unable to discover GitHub releases/latest (HTTP $($statusCode ?? 'unknown')): $($_.Exception.Message)"
            }
          }
          if ($null -ne $latest) {
            if ($latest.draft -or $latest.prerelease -or $latest.tag_name -notmatch '^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$') {
              throw "GitHub releases/latest did not return a stable release tag"
            }
            $guardArgs += @("--latest-stable", $latest.tag_name.Substring(1))
            Write-Host "Latest stable release: $($latest.tag_name.Substring(1))"
          }
          node @guardArgs

      - name: Build Forge artifacts and save dry-run metadata
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIM_UPDATE_BASE_URL: ${{ env.COS_APP_FEED }}
        run: |
          foreach ($generatedPath in @("out", "release-feed", "release-download", "release-evidence")) {
            if (Test-Path -LiteralPath $generatedPath) {
              throw "Release runner is not clean; remove stale generated path before rerunning: $generatedPath"
            }
          }
          npx electron-forge publish --dry-run

      - name: Gate - packaged update feed injection
        shell: pwsh
        env:
          EXPECTED_COS_APP_FEED: ${{ env.COS_APP_FEED }}
        run: |
          $asarFiles = @(Get-ChildItem -LiteralPath "out" -Recurse -File -Filter "app.asar" | Where-Object {
            $_.FullName -notmatch "\\publish-dry-run\\"
          })
          if ($asarFiles.Count -ne 1) {
            throw "Expected exactly one packaged app.asar, found $($asarFiles.Count)"
          }
          $env:RELEASE_ASAR_PATH = $asarFiles[0].FullName
          node --input-type=module -e 'import { extractFile, listPackage } from "@electron/asar"; import process from "node:process"; const asarPath = process.env.RELEASE_ASAR_PATH; const expectedFeed = process.env.EXPECTED_COS_APP_FEED; const oldGitHubFeed = "update.electronjs.org/Uyoung666/ai-image-manager"; const runtimeOverrides = ["AIM_UPDATE_TEST_BASE_URL", "process.env.AIM_UPDATE_BASE_URL"]; const entries = listPackage(asarPath).filter((entry) => /^[\\/]?\.vite[\\/]build[\\/].*\.js$/i.test(entry)); if (entries.length === 0) { throw new Error("Packaged app.asar has no .vite/build JavaScript bundles"); } const source = entries.map((entry) => extractFile(asarPath, entry.replace(/^[\\/]/, "")).toString("utf8")).join("\n"); if (!source.includes(expectedFeed)) { throw new Error(`Packaged Vite bundles do not contain the exact COS_APP_FEED: ${expectedFeed}`); } if (source.includes(oldGitHubFeed)) { throw new Error(`Packaged Vite bundles still contain the retired GitHub update feed: ${oldGitHubFeed}`); } for (const override of runtimeOverrides) { if (source.includes(override)) { throw new Error(`Packaged Vite bundles still expose runtime update override: ${override}`); } } console.log(`Verified ${asarPath}: exact COS feed injected; retired/runtime feeds absent across ${entries.length} bundles.`);'
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged update feed injection gate failed"
          }

      - name: Verify Squirrel and WiX release payload
        id: payload
        shell: pwsh
        run: |
          $squirrelDirectory = Join-Path $PWD "out\make\squirrel.windows\x64"
          $wixDirectory = Join-Path $PWD "out\make\wix\x64"
          $zipDirectory = Join-Path $PWD "out\make\zip\win32\x64"
          $manifest = Join-Path $squirrelDirectory "RELEASES"
          $releaseVersion = "${{ steps.release.outputs.version }}"
          $currentFullPattern = "-$([regex]::Escape($releaseVersion))-full\.nupkg$"
          $currentDeltaPattern = "-$([regex]::Escape($releaseVersion))-delta\.nupkg$"
          $fullPackage = @(Get-ChildItem -LiteralPath $squirrelDirectory -File -Filter "*.nupkg" | Where-Object { $_.Name -match $currentFullPattern })
          $deltaPackage = @(Get-ChildItem -LiteralPath $squirrelDirectory -File -Filter "*.nupkg" | Where-Object { $_.Name -match $currentDeltaPattern })
          $setup = @(Get-ChildItem -LiteralPath $squirrelDirectory -File -Filter "*Setup.exe")
          $msi = @(Get-ChildItem -LiteralPath $wixDirectory -File -Filter "*.msi")
          $wixSource = @(Get-ChildItem -LiteralPath $wixDirectory -File -Filter "*.wxs")
          $zip = @(Get-ChildItem -LiteralPath $zipDirectory -File -Filter "*.zip" | Where-Object {
            $_.Name -match "-$([regex]::Escape($releaseVersion))\.zip$"
          })

          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "Missing Squirrel RELEASES manifest"
          }
          if ($fullPackage.Count -ne 1) {
            throw "Expected exactly one Squirrel full NUPKG, found $($fullPackage.Count)"
          }
          if ($setup.Count -ne 1) {
            throw "Expected exactly one Squirrel Setup.exe, found $($setup.Count)"
          }
          if ($msi.Count -ne 1) {
            throw "Expected exactly one WiX MSI, found $($msi.Count)"
          }
          if ($wixSource.Count -ne 1) {
            throw "Expected generated WiX source, found $($wixSource.Count)"
          }
          if ($zip.Count -ne 1) {
            throw "Expected exactly one current-version ZIP, found $($zip.Count)"
          }
          if ($env:AIM_HAS_STABLE_BASELINE -eq "1" -and $deltaPackage.Count -ne 1) {
            throw "Stable RELEASES baseline was configured but no Squirrel delta NUPKG was produced"
          }
          if ($env:AIM_HAS_STABLE_BASELINE -ne "1" -and $deltaPackage.Count -gt 0) {
            throw "A delta package was produced without an explicitly configured stable baseline"
          }

          $wixSourcePath = $wixSource[0].FullName
          if (-not (Select-String -LiteralPath $wixSourcePath -SimpleMatch 'InstallScope="perMachine"')) {
            throw "WiX MSI must run per-machine"
          }
          if (Select-String -LiteralPath $wixSourcePath -Pattern 'DISABLEROLLBACK|<DisableRollback') {
            throw "WiX MSI must preserve transactional rollback"
          }
          if (-not (Select-String -LiteralPath $wixSourcePath -SimpleMatch 'Icon="ApplicationIcon" IconIndex="0"')) {
            throw "WiX shortcuts are missing their cached application icon"
          }

          "squirrel=$squirrelDirectory" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "wix=$wixDirectory" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "setup=$($setup[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "msi=$($msi[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip=$($zip[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Verified full Squirrel package, optional delta baseline, Setup.exe, MSI rollback, and shortcut icon."

      - name: Stage minimal Squirrel feed payload
        id: feed
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $source = Join-Path $PWD "out\make\squirrel.windows\x64"
          $staging = Join-Path $PWD "release-feed"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -LiteralPath (Join-Path $source "RELEASES") -Destination $staging
          # remoteReleases places the one-version build-base full beside the
          # current full/delta. Keep every package referenced by RELEASES so
          # Squirrel can recognize the installed baseline and choose delta.
          $packages = @(Get-ChildItem -LiteralPath $source -File -Filter "*.nupkg")
          if (@($packages | Where-Object {
            $_.Name -match "-$([regex]::Escape($env:RELEASE_VERSION))-full\.nupkg$"
          }).Count -ne 1) {
            throw "Minimal Squirrel feed must contain exactly one current full package"
          }
          foreach ($package in $packages) {
            Copy-Item -LiteralPath $package.FullName -Destination $staging
          }
          "path=$staging" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Staged minimal Squirrel feed without the redundant Setup.exe upload: $staging"

      - name: Upload candidate to COS testing
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          FEED_DIR: ${{ steps.feed.outputs.path }}
        run: |
          # The repository-owned CLI writes only the testing run prefix here;
          # it cannot touch stable/RELEASES during a candidate build.
          node scripts/release-cos.mjs upload-testing `
            --dir $env:FEED_DIR `
            --version $env:RELEASE_VERSION `
            --tag $env:RELEASE_TAG `
            --run-id $env:GITHUB_RUN_ID `
            --require-releases

      - name: Run Squirrel Setup.exe upgrade smoke
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          AIM_OLD_SETUP_URL: ${{ vars.AIM_OLD_SETUP_URL }}
          AIM_OLD_SETUP_SHA256: ${{ vars.AIM_OLD_SETUP_SHA256 }}
          AIM_OLD_SETUP_VERSION: ${{ vars.AIM_OLD_SETUP_VERSION }}
          AIM_OLD_SQUIRREL_FULL_URL: ${{ vars.AIM_OLD_SQUIRREL_FULL_URL }}
          AIM_OLD_SQUIRREL_FULL_SHA256: ${{ vars.AIM_OLD_SQUIRREL_FULL_SHA256 }}
        run: node scripts/windows-installer-smoke.mjs setup-upgrade --setup "${{ steps.payload.outputs.setup }}" --version $env:RELEASE_VERSION --feed "${{ steps.release.outputs.testing-feed }}"

      - name: Run MSI install or auto-update smoke
        id: msi_smoke
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          AIM_OLD_MSI_URL: ${{ vars.AIM_OLD_MSI_URL }}
          AIM_OLD_MSI_SHA256: ${{ vars.AIM_OLD_MSI_SHA256 }}
          AIM_OLD_MSI_VERSION: ${{ vars.AIM_OLD_MSI_VERSION }}
        run: |
          $baselineValues = @(
            $env:AIM_OLD_MSI_URL,
            $env:AIM_OLD_MSI_SHA256,
            $env:AIM_OLD_MSI_VERSION
          )
          $configuredValues = @($baselineValues | Where-Object { $_ -and $_.Trim() })
          if ($configuredValues.Count -ne 0 -and $configuredValues.Count -ne 3) {
            throw "Configure all three previous MSI variables or leave all three empty"
          }

          if ($configuredValues.Count -eq 3) {
            node scripts/windows-installer-smoke.mjs msi-upgrade `
              --msi "${{ steps.payload.outputs.msi }}" `
              --version $env:RELEASE_VERSION `
              --feed "${{ steps.release.outputs.testing-feed }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $mode = "upgrade"
          } elseif ($env:RELEASE_VERSION -eq $env:AIM_FIRST_OFFICIAL_MSI_VERSION) {
            node scripts/windows-installer-smoke.mjs msi-fresh `
              --msi "${{ steps.payload.outputs.msi }}" `
              --version $env:RELEASE_VERSION
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $mode = "fresh-bootstrap"
          } else {
            throw "A verified previous MSI baseline is mandatory after v$env:AIM_FIRST_OFFICIAL_MSI_VERSION"
          }
          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Write candidate smoke evidence
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          FEED_DIR: ${{ steps.feed.outputs.path }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          New-Item -ItemType Directory -Force -Path release-evidence | Out-Null
          @{
            schemaVersion = 2
            version = $env:RELEASE_VERSION
            tag = $env:RELEASE_TAG
            commit = $env:RELEASE_COMMIT
            setupSmoke = "passed"
            msiSmoke = "passed"
            msiSmokeMode = "${{ steps.msi_smoke.outputs.mode }}"
            note = "Setup always upgrades a verified public baseline. MSI uses a one-time fresh bootstrap only for the first official MSI; later releases require a verified MSI auto-update."
          } | ConvertTo-Json | Out-File -FilePath release-evidence\smoke-status.json -Encoding utf8

      - name: Upload Squirrel candidate to COS candidate prefix
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          FEED_DIR: ${{ steps.feed.outputs.path }}
        run: |
          # Candidate contains only the Squirrel feed. Stable is changed later
          # by promote-release.yaml.
          node scripts/release-cos.mjs upload-candidate `
            --dir $env:FEED_DIR `
            --version $env:RELEASE_VERSION `
            --tag $env:RELEASE_TAG `
            --require-releases

      - name: Stage flat immutable download payload
        id: download
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CANDIDATE_ZIP: ${{ steps.payload.outputs.zip }}
        run: |
          $staging = Join-Path $PWD "release-download"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $squirrelDirectory = Join-Path $PWD "out\make\squirrel.windows\x64"
          $wixDirectory = Join-Path $PWD "out\make\wix\x64"
          $releaseVersion = $env:RELEASE_VERSION
          $currentPackages = @(Get-ChildItem -LiteralPath $squirrelDirectory -File -Filter "*.nupkg" | Where-Object {
            $_.Name -match "-$([regex]::Escape($releaseVersion))-(?:full|delta)\.nupkg$"
          })
          $setup = Get-ChildItem -LiteralPath $squirrelDirectory -File -Filter "*Setup.exe" | Select-Object -First 1
          $msi = Get-ChildItem -LiteralPath $wixDirectory -File -Filter "*.msi" | Select-Object -First 1
          $zip = Get-Item -LiteralPath $env:CANDIDATE_ZIP
          foreach ($source in @($setup.FullName, $msi.FullName, $zip.FullName)) {
            if (-not $source -or -not (Test-Path -LiteralPath $source)) {
              throw "Required flat download artifact is missing: $source"
            }
          }
          if ($currentPackages.Count -lt 1) {
            throw "No current-version Squirrel package was found for $releaseVersion"
          }
          foreach ($package in $currentPackages) {
            Copy-Item -LiteralPath $package.FullName -Destination $staging
          }
          Copy-Item -LiteralPath $setup.FullName -Destination $staging
          Copy-Item -LiteralPath $msi.FullName -Destination $staging
          Copy-Item -LiteralPath $zip.FullName -Destination $staging
          "path=$staging" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Staged flat download payload: $staging"

      - name: Upload immutable versioned download payload to COS
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DOWNLOAD_DIR: ${{ steps.download.outputs.path }}
        run: |
          node scripts/release-cos.mjs upload-versioned `
            --dir $env:DOWNLOAD_DIR `
            --version $env:RELEASE_VERSION `
            --tag $env:RELEASE_TAG
          foreach ($generated in @("SHA256SUMS.txt", "provenance.json")) {
            $generatedPath = Join-Path $env:DOWNLOAD_DIR $generated
            if (-not (Test-Path -LiteralPath $generatedPath -PathType Leaf)) {
              throw "release-cos did not materialize $generatedPath"
            }
          }

      - name: Upload candidate build for promotion
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ steps.release.outputs.version }}
          path: out/make/
          if-no-files-found: error
          retention-days: 30

      - name: Generate SHA256 release manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path release-evidence | Out-Null
          $lines = @()
          Get-ChildItem -LiteralPath "out\make" -Recurse -File | Sort-Object FullName | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [IO.Path]::GetRelativePath((Join-Path $PWD "out\make"), $_.FullName).Replace('\', '/')
            $lines += "$hash  $relative"
          }
          if ($lines.Count -eq 0) {
            throw "No release files were found for SHA256 manifest"
          }
          $lines | Out-File -FilePath release-evidence\SHA256SUMS.txt -Encoding ascii
          "version=$env:RELEASE_VERSION" | Out-File -FilePath release-evidence\candidate-metadata.txt -Encoding ascii
          "commit=${{ steps.release.outputs.commit }}" | Out-File -FilePath release-evidence\candidate-metadata.txt -Encoding ascii -Append
          Copy-Item -LiteralPath release-download\SHA256SUMS.txt -Destination release-evidence\download-SHA256SUMS.txt
          Copy-Item -LiteralPath release-download\provenance.json -Destination release-evidence\download-provenance.json
          Copy-Item -LiteralPath release-feed\SHA256SUMS.txt -Destination release-evidence\candidate-SHA256SUMS.txt
          Copy-Item -LiteralPath release-feed\provenance.json -Destination release-evidence\candidate-provenance.json
          Copy-Item -LiteralPath release-feed\RELEASES -Destination release-evidence\candidate-RELEASES

      - name: Attest candidate artifacts
        uses: actions/attest@v4
        with:
          subject-path: out/make/**

      - name: Attest flat download and checksum artifacts
        uses: actions/attest@v4
        with:
          subject-path: release-download/**

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ steps.release.outputs.version }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Draft from Forge dry-run
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-forge publish --from-dry-run --target github

      - name: Attach SHA256SUMS and release notes to GitHub Draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release upload $env:RELEASE_TAG release-download\SHA256SUMS.txt release-download\provenance.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to attach SHA256SUMS.txt to GitHub Draft"
          }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --notes-file release-body.md
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to set release-body.md on GitHub Draft"
          }
