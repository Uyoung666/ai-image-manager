name: Publish Release

on:
  workflow_dispatch:

jobs:
  publish-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v6

      - name: Install Node and NPM
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.0 --yes --no-progress
          "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify WiX Toolset
        shell: pwsh
        run: |
          Get-Command candle.exe -ErrorAction Stop
          Get-Command light.exe -ErrorAction Stop

      - name: Install and build
        run: npm ci

      - name: Rebuild Electron native modules
        run: npm run rebuild:native

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish

      - name: Verify Windows release payload
        shell: pwsh
        run: |
          $squirrelDirectory = Join-Path $PWD "out\make\squirrel.windows\x64"
          $wixDirectory = Join-Path $PWD "out\make\wix\x64"
          $manifest = Join-Path $squirrelDirectory "RELEASES"
          $fullPackage = Get-ChildItem -LiteralPath $squirrelDirectory -File -Filter "*-full.nupkg"
          $setup = Get-ChildItem -LiteralPath $squirrelDirectory -File -Filter "*Setup.exe"
          $msi = Get-ChildItem -LiteralPath $wixDirectory -File -Filter "*.msi"
          $wixSource = Get-ChildItem -LiteralPath $wixDirectory -File -Filter "*.wxs"

          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "Missing Squirrel RELEASES manifest; GitHub auto-update would not work."
          }
          if (-not $fullPackage) {
            throw "Missing Squirrel full NUPKG; GitHub auto-update would not work."
          }
          if (-not $setup) {
            throw "Missing Squirrel Setup.exe; the GitHub update release is incomplete."
          }
          if (-not $msi) {
            throw "Missing WiX MSI; the custom-directory installer was not created."
          }
          if (-not $wixSource) {
            throw "Missing generated WiX source; uninstall safeguards cannot be verified."
          }

          $perMachineScope = Select-String -LiteralPath $wixSource.FullName -SimpleMatch 'InstallScope="perMachine"'
          if (-not $perMachineScope) {
            throw "WiX MSI must run per-machine so custom-volume rollback files can be secured."
          }
          $rollbackDisabled = Select-String -LiteralPath $wixSource.FullName -Pattern 'DISABLEROLLBACK|<DisableRollback'
          if ($rollbackDisabled) {
            throw "WiX MSI must preserve transactional rollback; disabling it causes MSI 2502/2503 failures."
          }
          $shortcutIcon = Select-String -LiteralPath $wixSource.FullName -SimpleMatch 'Icon="ApplicationIcon" IconIndex="0"'
          if (-not $shortcutIcon) {
            throw "WiX shortcuts are missing their cached application icon."
          }

          Write-Host "Verified Squirrel payload, elevated MSI rollback, and shortcut icon."
