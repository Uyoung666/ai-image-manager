name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests-unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules
        run: |
          node -e "const fs=require('fs');['better-sqlite3','@lancedb/lancedb'].forEach(m=>{const p='node_modules/'+m+'/build/Release';if(fs.existsSync(p))fs.rmSync(p,{recursive:true,force:true})})"
          npx electron-rebuild -f
      - name: Run unit tests
        run: npm run test:unit

  test-e2e:
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules
        run: |
          node -e "const fs=require('fs');['better-sqlite3','@lancedb/lancedb'].forEach(m=>{const p='node_modules/'+m+'/build/Release';if(fs.existsSync(p))fs.rmSync(p,{recursive:true,force:true})})"
          npx electron-rebuild -f
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Create models placeholder
        run: node -e "fs.mkdirSync('models',{recursive:true})"
      - name: Create Executable
        run: npm run make
      - name: Run Playwright tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
