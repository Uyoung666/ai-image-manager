name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_call:
    inputs:
      commit:
        type: string
        default: ''
      skip_e2e:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests-unit:
    timeout-minutes: 30
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache unit models
        uses: actions/cache@v4
        with:
          path: models
          key: ${{ runner.os }}-models-${{ inputs.skip_e2e && 'all' || 'unit' }}-${{ hashFiles('src/services/model-downloader.ts') }}
      - name: Prepare models for model-backed tests
        env:
          AIM_MODEL_SCOPE: ${{ !inputs.skip_e2e && 'face,Xenova/siglip-base-patch16-224' || '' }}
        run: node --loader ts-node/esm scripts/prepare-models.mjs
      - name: Run unit tests
        run: npm test
      - name: Run AI integration tests
        run: npm run test:ai-integration
      - name: Run worker tests
        run: npm run test:worker

  test-face-migration:
    timeout-minutes: 20
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache face models
        uses: actions/cache@v4
        with:
          path: models
          key: ${{ runner.os }}-models-face-${{ hashFiles('src/services/model-downloader.ts') }}
      - name: Prepare models for model-backed tests
        env:
          AIM_MODEL_SCOPE: face
        run: node --loader ts-node/esm scripts/prepare-models.mjs
      - name: Run face migration tests
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: .\\node_modules\\.bin\\electron.cmd --test src/tests/unit/face-data-migration.test.mjs

  test-e2e:
    if: '!inputs.skip_e2e'
    timeout-minutes: 45
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache E2E models
        uses: actions/cache@v4
        with:
          path: models
          key: ${{ runner.os }}-models-all-${{ hashFiles('src/services/model-downloader.ts') }}
      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
      - name: Run Playwright tests
        env:
          AIM_E2E_PREPARE_MODELS: "1"
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
          retention-days: 30
