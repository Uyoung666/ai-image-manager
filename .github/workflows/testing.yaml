name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_call:
    inputs:
      commit:
        type: string
        default: ''
      skip_e2e:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests-unit:
    timeout-minutes: 30
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm run ci:verify -- install-runtime
      - name: Cache unit models
        uses: actions/cache@v4
        with:
          path: models
          key: ${{ runner.os }}-models-${{ inputs.skip_e2e && 'all' || 'unit' }}-${{ hashFiles('src/services/model-downloader.ts') }}
      - name: Run unit, AI integration and worker tests
        env:
          AIM_MODEL_SCOPE: ${{ !inputs.skip_e2e && 'face,Xenova/siglip-base-patch16-224' || '' }}
        run: npm run ci:verify -- unit

  test-face-migration:
    timeout-minutes: 20
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm run ci:verify -- install-runtime
      - name: Cache face models
        uses: actions/cache@v4
        with:
          path: models
          key: ${{ runner.os }}-models-face-${{ hashFiles('src/services/model-downloader.ts') }}
      - name: Run face migration tests
        run: npm run ci:verify -- face

  test-e2e:
    if: '!inputs.skip_e2e'
    timeout-minutes: 45
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm run ci:verify -- install-runtime
      - name: Cache E2E models
        uses: actions/cache@v4
        with:
          path: models
          key: ${{ runner.os }}-models-all-${{ hashFiles('src/services/model-downloader.ts') }}
      - name: Run Playwright tests
        run: npm run ci:verify -- e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
          retention-days: 30
