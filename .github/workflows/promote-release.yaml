# Compatibility only. Use the Release workflow for all manual publication.
name: Promote release (compatibility)
'on':
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_run_id:
        required: true
        type: string
permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  release:
    uses: ./.github/workflows/publish.yaml
    with:
      version: ${{ inputs.version }}
      source_run_id: ${{ inputs.source_run_id }}
    secrets: inherit
