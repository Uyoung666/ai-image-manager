name: Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      commit:
        type: string
        default: ''
      locale_baseline:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install check tooling
        run: npm run ci:verify -- install-check
      - name: Check formatting, lint, types and release contracts
        run: npm run ci:verify -- static
      - name: Check Windows validation launcher
        if: inputs.commit != ''
        run: |
          npm rebuild electron --foreground-scripts
          if ($LASTEXITCODE -ne 0) { throw "Electron probe installation failed" }
          node scripts/release/test-standard-user-launch.mjs
      - name: Save Windows launcher diagnostics
        if: failure() && inputs.commit != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-launcher-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .test-runtime/product-update-standard-user-*/probe.log
            .test-runtime/product-update-standard-user-*/chromium.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Check Japanese against a formal release
        env:
          LOCALE_BASELINE_REF: ${{ inputs.locale_baseline }}
        run: npm run ci:verify -- locale
