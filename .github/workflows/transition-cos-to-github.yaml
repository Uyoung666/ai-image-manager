name: Transition COS stable feed to GitHub
'on':
  workflow_dispatch:
    inputs:
      version:
        description: '要迁移到的正式版本（本次固定为 2.2.1）'
        required: true
        default: '2.2.1'
        type: string
      confirmation:
        description: '输入 SWITCH COS STABLE TO GITHUB V2.2.1 才会执行'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-production
  cancel-in-progress: false

env:
  COS_RELEASE_PREFIX: ${{ vars.COS_RELEASE_PREFIX || 'ai-image-manager' }}
  COS_BUCKET: ${{ vars.COS_BUCKET || 'ai-image-manager-1392398678' }}
  COS_REGION: ${{ vars.COS_REGION || 'ap-hongkong' }}
  TRANSITION_VERSION: ${{ inputs.version }}
  TRANSITION_CONFIRMATION: ${{ inputs.confirmation }}
  COS_TRANSITION_APPROVED: '1'
  TRANSITION_EVIDENCE: ${{ github.workspace }}/cos-transition-evidence.json

jobs:
  transition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-stable
    env:
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/release/package-lock.json
      - name: Install release transport only
        run: npm ci --ignore-scripts --prefix scripts/release
      - name: Verify GitHub assets and switch only the COS pointer
        run: node scripts/release/transition-cos-to-github.mjs
      - name: Save transition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cos-transition-${{ github.run_id }}
          path: cos-transition-evidence.json
          retention-days: 90
          if-no-files-found: ignore
